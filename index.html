<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Story Magic</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=OpenDyslexic:wght@400;700&display=swap">
</head>
<body class="theme-blue">
    <div class="container">
        <header>
            <h1>Story Magic</h1>
            <div class="theme-switcher">
                <button class="theme-btn blue" data-theme="blue"></button>
                <button class="theme-btn green" data-theme="green"></button>
                <button class="theme-btn purple" data-theme="purple"></button>
                <button class="theme-btn orange" data-theme="orange"></button>
            </div>
        </header>

        <div class="input-section">
            <input type="text" id="storyPrompt" placeholder="Enter your story idea (e.g. Squirrels on Ice)">
            <button id="generateBtn">Generate Story</button>
        </div>

        <div class="story-container hidden">
            <div class="story-controls">
                <button id="prevPage">Previous</button>
                <span id="pageIndicator">Page 1 of 10</span>
                <button id="nextPage">Next</button>
                <button id="readBtn">Read Aloud</button>
            </div>

            <div class="story-content">
                <div class="english-story">
                    <h2>English</h2>
                    <div id="englishText" class="story-text"></div>
                </div>
                <div class="spanish-story">
                    <h2>Spanish</h2>
                    <div id="spanishText" class="story-text"></div>
                </div>
            </div>

            <div class="word-highlighter">
                <p>Click on any word to hear it again</p>
                <div id="wordDisplay"></div>
            </div>
        </div>

        <div class="loading hidden">
            <div class="spinner"></div>
            <p>Creating your magical story...</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
