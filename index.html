<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kids' Story Generator</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=OpenDyslexic:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>Magic Story Maker</h1>
            <div class="controls">
                <div class="api-inputs">
                    <div>
                        <label for="openai-key">OpenAI API Key:</label>
                        <input type="password" id="openai-key" placeholder="sk-...">
                    </div>
                    <div>
                        <label for="tts-key">TTS API Key:</label>
                        <input type="password" id="tts-key" placeholder="Your TTS key">
                    </div>
                </div>
                <div class="theme-selector">
                    <button class="theme-btn" data-theme="light">☀️ Light</button>
                    <button class="theme-btn" data-theme="dark">🌙 Dark</button>
                    <button class="theme-btn" data-theme="sepia">📜 Sepia</button>
                    <button class="theme-btn" data-theme="blue">🔵 Blue</button>
                </div>
                <div class="language-selector">
                    <button id="lang-en" class="lang-btn active">English</button>
                    <button id="lang-es" class="lang-btn">Español</button>
                </div>
            </div>
        </header>

        <div class="story-prompt">
            <input type="text" id="story-idea" placeholder="Enter your story idea (e.g. A cow who sang aloud)">
            <button id="generate-btn">Create Story</button>
        </div>

        <div class="story-container hidden">
            <div class="story-display">
                <div class="story-page english">
                    <div class="story-text"></div>
                    <button class="read-aloud">
                        <img src="assets/icons/read-aloud.svg" alt="Read aloud">
                    </button>
                </div>
                <div class="story-page spanish hidden">
                    <div class="story-text"></div>
                    <button class="read-aloud">
                        <img src="assets/icons/read-aloud.svg" alt="Leer en voz alta">
                    </button>
                </div>
            </div>
            
            <div class="story-controls">
                <button class="nav-btn prev-page" disabled>
                    <img src="assets/icons/prev-page.svg" alt="Previous page">
                </button>
                <span class="page-indicator">Page 1 of 1</span>
                <button class="nav-btn next-page" disabled>
                    <img src="assets/icons/next-page.svg" alt="Next page">
                </button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
